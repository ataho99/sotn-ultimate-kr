name: 번역 오류·오타
description: 오역, 오타, 어색한 표현, 영어로 남은 곳
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: "⚠ ROM·디스크 이미지는 절대 첨부하지 마세요."
