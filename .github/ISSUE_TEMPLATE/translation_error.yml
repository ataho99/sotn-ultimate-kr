    id: where
    attributes: {label: 위치(장소·메뉴·장면)}
    validations: {required: true}
  - type: textarea
    id: current
    attributes: {label: 현재 화면에 나온 문장(스크린샷 첨부 가능)}
    validations: {required: true}
  - type: textarea
    id: suggest
    attributes: {label: 제안하는 문장과 이유}
  - type: input
    id: version
    attributes: {label: 한글판 버전}
